<header class="top"><div class="topin"><div class="brand">IDOL CONNECTION</div><div id="topmode" class="pill" style="background:#ffffff20;color:white">尚未開始</div><div id="clock" class="clock">DAY 1 · 08:00</div><button id="pause" style="padding:6px 9px;font-size:11px">暫停</button><button id="speed" style="padding:6px 9px;font-size:11px">×1</button></div></header>
<main class="app"><section id="setup" class="setup"><div class="hero"><small>A LIVING TPOP UNIVERSE</small><h1>走進你的偶像世界</h1><p>自由生活、探索城市、工作與休息、認識不同團體的人。沒有唯一正確的玩法，世界也不會只圍著你轉。</p></div><div class="card"><h3>建立新世界</h3><div class="field"><label>遊玩身分</label><div class="seg"><button id="idolMode" class="active">偶像模式</button><button id="managerMode">經紀人模式</button></div></div><div id="idolFields"><div class="field"><label>團體／個人歌手</label><select id="group"></select></div><div class="field" id="memberField"><label id="memberLabel">選擇團體成員</label><select id="member"></select><div class="tiny muted" id="memberNote" style="margin-top:6px"></div></div></div><div id="managerFields" hidden><div class="field"><label>經紀人姓名</label><input id="managerName" value="我的經紀人"></div><div class="field"><label>身分</label><select id="gender"><option>女經紀人</option><option>男經紀人</option><option>不設定</option></select></div></div><div class="note">團體模式必須從成員下拉選單選擇；個人歌手會直接以本人身分開始，不會再出現成員欄位。部分團體的正式名單尚未成功同步至目前公開版，會明確顯示資料狀態，不要求玩家自行輸入姓名。</div><button class="primary" id="start" style="width:100%;margin-top:12px">開始生活</button><div class="row" style="margin-top:8px"><button id="load">讀取此裝置存檔</button><button id="import">匯入 JSON</button></div></div></section>
<section id="game" hidden><div class="layout"><aside class="side"><div class="identity"><b id="sideName">玩家</b><span class="tiny muted" id="sideRole"></span><div class="row" style="margin-top:7px"><span class="pill" id="day">第 1 天</span><span class="pill" id="place">宿舍</span></div></div><nav class="nav" id="nav"></nav></aside><div><div class="pagehead"><div><h2 id="pagetitle">生活現場</h2><span id="pagesub" class="tiny muted">你目前的日常</span></div><button id="save">儲存</button></div><div id="metrics" class="metrics"></div><div id="content"></div></div></div></section></main>

<script>
(function(){
const $=id=>document.getElementById(id),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])),rand=a=>a[Math.floor(Math.random()*a.length)],clamp=n=>Math.max(0,Math.min(100,n));
const DB=[
["Ozone",["周祖安","周子翔","黃文廷","林佳辰","林煥鈞","李哲言"],"六人名單｜公開資料同步"],
["AcQUA 源少年",["黃莑茗","盧佾暘","李秉諭","林毓家"],"現任四人名單｜須弘道列為曾任成員"],
["FEniX",["浦洋","峻廷","家齊","MAX","承隆"],"專案成員名稱"],
["VERA",["Nelson（紀成澔）","藍弟（藍子桓）","蔡朕","學文（廖學文）","孟維"],"團體成員；巴比另列個人歌手"],
["U:NUS",["高胥崴","高有翔","吳昱廷","蔡承祐"],"四人名單｜公開資料同步"],
["OPENsi",["黃威任","陳治廷","邱勝揚","陳子輇"],"四人名單｜2026 合約期滿後單飛不解散"],
["Saturnday",["新民","立杰","凱杰","永安"],"專案成員名稱"],
["F.F.O",["鈞嘉","俊希","小新","彥旭","勝銘","至琦","加藤琉士"],"鈞嘉為藝名／常用名；張鈞嘉為本名"],
["ARKis",["Alex","黃崇峻","Vin","鄭彫秦","禾雁凱","Mikey","李東翰","李定"],"Vin、Mikey 使用藝名"],
["B CRUSH（不小心製造）",["洪暐","宰宰","彥","蝶香"],"專案既有名單"],
["ELL&s",["閃閃","玉歆","若熙","Cherry"],"專案既有名單"],
["幽靈水晶",["芝婷","昀靚","子瑄","書蘊","蔡菜","子秦"],"專案既有名單"]
];
const SOLO_ARTISTS=[
 {label:"HAKU（個人歌手）",name:"HAKU",key:"solo|HAKU",affiliations:[]},
 {label:"巴比（個人歌手）",name:"巴比",key:"solo|巴比",affiliations:["VERA"]},
 {label:"植宇（個人歌手）",name:"植宇",key:"solo|植宇",aliases:["呂植宇"],producerCredit:"LCY",affiliations:[]}
];
const ARTIST_META={
 "F.F.O|鈞嘉":{displayName:"鈞嘉",legalName:"張鈞嘉",note:"遊戲與藝人名單使用「鈞嘉」；「張鈞嘉」是本名。"},
 "ARKis|Vin":{displayName:"Vin",stageName:"Vin",actorName:"黃嘉楷",note:"Vin 是藝名；黃嘉楷是以演員身分出現時使用的姓名。"},
 "ARKis|Mikey":{displayName:"Mikey",stageName:"Mikey",legalName:"伍承慶",note:"Mikey 是藝名；伍承慶是本名，較少使用。"},
 "solo|巴比":{displayName:"巴比",legalName:"林子祐",affiliations:["VERA"],category:"個人歌手"},
 "solo|植宇":{displayName:"植宇",alternateName:"呂植宇",producerCredit:"LCY",note:"平常使用「植宇」或「呂植宇」；LCY 僅用於音樂製作署名。"}
};
const FORMATIVE_MEMBERS={"AcQUA 源少年":["須弘道"]};
const LOC=[["宿舍","生活休息、整理房間與日常互動。"],["經紀公司","會議、企劃、工作窗口和團體行程。"],["練習室 A","團體排練、舞蹈和歌唱訓練。"],["練習室 B","另一個練習空間，常有不同人物出入。"],["錄音室","錄音、試唱、作品討論。"],["攝影棚","形象拍攝、短影音和品牌工作。"],["餐廳","用餐和偶遇熟人的公共場所。"],["咖啡店","聊天、休息或一個人度過下午。"],["商圈","採買日用品、逛街和購物。"],["公園","散步、慢跑和放空。"],["表演場館","彩排、演出和粉絲活動。"]];
const all=[
 ...DB.flatMap(g=>g[1].map(n=>({name:n,group:g[0],provisional:false,meta:ARTIST_META[g[0]+"|"+n]||null}))),
 ...SOLO_ARTISTS.map(a=>({name:a.name,group:"個人歌手",solo:true,key:a.key,aliases:a.aliases||[],producerCredit:a.producerCredit||"",affiliations:a.affiliations||[],meta:ARTIST_META[a.key]||null,provisional:false}))
];
const PAGES=[["home","⌂","生活現場"],["world","◇","世界地圖"],["people","♙","人物與關係"],["phone","▣","手機社群"],["work","▤","工作行程"],["roster","◎","人物資料庫"],["journal","≡","世界紀錄"],["settings","⚙","存檔回報"]];
let mode="idol",S=null,page="home",timer=null,last=Date.now();
const SOLO_GROUPS=SOLO_ARTISTS.map(a=>a.label);
DB.forEach(g=>$("group").add(new Option(g[0],g[0])));
SOLO_ARTISTS.forEach(a=>$("group").add(new Option(a.label,a.label)));
$("group").onchange=fillMembers;fillMembers();
function fillMembers(){
 let selected=$("group").value;
 let solo=SOLO_ARTISTS.find(a=>a.label===selected);
 let g=DB.find(x=>x[0]===selected),sel=$("member");
 if(solo){
  $("memberField").hidden=true;
  $("memberNote").textContent="個人歌手直接以「"+solo.name+"」身分開始，不需要選擇團體成員。";
  $("start").disabled=false;
  return;
 }
 $("memberField").hidden=false;
 $("memberLabel").textContent="選擇團體成員";
 sel.innerHTML="";
 if(g&&g[1].length){
  g[1].forEach(n=>sel.add(new Option(n,n)));
  sel.disabled=false;
  $("memberNote").textContent=g[2]||"團體成員名單";
  $("start").disabled=false;
 }else{
  sel.add(new Option("成員資料尚未載入",""));
  sel.disabled=true;
  $("memberNote").textContent="此團體目前沒有可選成員資料。";
  $("start").disabled=true;
 }
}
$("idolMode").onclick=()=>setMode("idol");$("managerMode").onclick=()=>setMode("manager");
function setMode(m){mode=m;$("idolMode").classList.toggle("active",m==="idol");$("managerMode").classList.toggle("active",m==="manager");$("idolFields").hidden=m!=="idol";$("managerFields").hidden=m!=="manager";if(m==="manager")$("start").disabled=false;else fillMembers()}
function person(name,group,place){return {id:group+"|"+name,name,group,place,energy:70+Math.random()*25,hunger:60+Math.random()*35,hygiene:65+Math.random()*30,social:50+Math.random()*40,fun:50+Math.random()*40,mood:60+Math.random()*30,money:20000,skills:{歌唱:25,舞蹈:25,表演:20},trait:rand(["慢熟","外向","細心","行動派","隨和","好勝","感性","理性"]),schedule:"自由活動"}}
function createWorld(){
 let group,name,soloProfile=null;
 if(mode==="idol"){
  const selected=$("group").value;
  soloProfile=SOLO_ARTISTS.find(a=>a.label===selected)||null;
  if(soloProfile){group="個人歌手";name=soloProfile.name;}
  else {group=selected;name=$("member").value;if(!name){toast("請先選擇團體成員");return;}}
 }else{group="獨立經紀人";name=$("managerName").value.trim()||"我的經紀人";}
 let chars=all.map((x,i)=>{
  let c=person(x.name,x.group,LOC[(i+2)%LOC.length][0]);
  c.provisional=!!x.provisional;c.meta=x.meta||null;c.affiliations=x.affiliations||[];
  c.aliases=x.aliases||[];c.producerCredit=x.producerCredit||"";c.id=x.key||c.id;
  return c;
 });
 let player=person(name,group,mode==="manager"?"經紀公司":"宿舍");
 player.id=soloProfile?soloProfile.key:"player|"+name;player.isPlayer=true;
 if(soloProfile){player.meta=ARTIST_META[soloProfile.key]||null;player.affiliations=soloProfile.affiliations||[];player.aliases=soloProfile.aliases||[];player.producerCredit=soloProfile.producerCredit||"";}
 chars=chars.filter(c=>c.id!==player.id&&!(c.group===group&&c.name===name));chars.unshift(player);
 S={version:"0.4.0",mode,identity:{name,group,gender:mode==="manager"?$("gender").value:"",artistKey:soloProfile?soloProfile.key:null},playerId:player.id,controlId:player.id,characters:chars,day:1,minute:mode==="manager"?540:480,speed:1,paused:false,money:player.money,place:player.place,relationships:{},events:[],messages:[],jobs:[],appointments:[],memories:[],lastAmbient:0};
 seedJobs();log("世界開始","你以"+(mode==="manager"?"獨立經紀人":soloProfile?"個人歌手":"團體成員")+"身分開始新的生活。");$("setup").hidden=true;$("game").hidden=false;save(true);startClock();render();
}
function cur(){return S.characters.find(c=>c.id===S.controlId)||S.characters[0]}
function time(){return String(Math.floor(S.minute/60)%24).padStart(2,"0")+":"+String(Math.floor(S.minute%60)).padStart(2,"0")}
function stamp(){return "第 "+S.day+" 天 "+time()}
function log(t,b){S.events.unshift({time:stamp(),title:t,body:b});S.events=S.events.slice(0,120)}
function msg(from,body){S.messages.unshift({time:stamp(),from,body});S.messages=S.messages.slice(0,50)}
function seedJobs(){S.jobs=[{id:"j1",title:"品牌短影音拍攝",description:"拍攝社群短影音素材，預估 90 分鐘。",day:S.day,minute:840,duration:90,pay:1800,place:"攝影棚",status:"待回覆"},{id:"j2",title:"團體排練",description:"確認下一次舞台的隊形和細節。",day:S.day,minute:1080,duration:120,pay:0,place:"練習室 A",status:"待回覆"}]}
function save(silent){if(!S)return;try{localStorage.setItem("ic_save_"+S.identity.name,JSON.stringify(S));localStorage.setItem("ic_current",S.identity.name);if(!silent)toast("已儲存世界進度")}catch(e){toast("無法儲存，請先匯出備份")}}
$("save").onclick=()=>save(false);
function exportSave(){if(!S)return;let a=document.createElement("a"),u=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:"application/json"}));a.href=u;a.download="IDOL-CONNECTION-save.json";a.click();URL.revokeObjectURL(u)}
function importSave(){let f=$("file").files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.characters||!x.identity)throw 0;S=x;$("setup").hidden=true;$("game").hidden=false;save(true);startClock();render();toast("存檔匯入完成")}catch(e){toast("存檔格式不正確")}};r.readAsText(f)}
$("import").onclick=()=>$("file").click();$("file").onchange=importSave;
$("load").onclick=()=>{let n=localStorage.getItem("ic_current");if(!n){toast("目前瀏覽器沒有存檔");return}try{S=JSON.parse(localStorage.getItem("ic_save_"+n));$("setup").hidden=true;$("game").hidden=false;startClock();render()}catch(e){toast("讀取失敗")}};
function startClock(){if(timer)clearInterval(timer);last=Date.now();timer=setInterval(()=>{let now=Date.now(),d=Math.min(5,(now-last)/1000);last=now;if(S&&!S.paused&&!document.hidden)tick(d*S.speed*1.3)},2000)}
document.addEventListener("visibilitychange",()=>{last=Date.now();if(S&&document.hidden){S.paused=true;$("pause").textContent="繼續";save(true)}});
